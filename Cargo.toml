[package]
name = "jetsontr"
version = "0.2.0"
edition = "2021"
description = "Jetson AGX Xavier system monitor for the Thermalright Trofeo Vision 9.16\" USB LCD"
license = "MIT"
repository = "https://github.com/beret21/JetsonTR"

[dependencies]
rusb = "0.9"
tiny-skia = "0.11"
ab_glyph = "0.2"
# libjpeg-turbo, built from source and linked statically (needs cmake and a C compiler).
turbojpeg = { version = "1.5", default-features = false, features = ["cmake"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
