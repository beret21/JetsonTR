[package]
name = "jetsontr"
version = "0.2.0"
edition = "2021"
description = "Jetson AGX Xavier system monitor for the Thermalright Trofeo Vision 9.16\" USB LCD"
license = "MIT"
repository = "https://github.com/beret21/JetsonTR"

[dependencies]
rusb = "0.9"
tiny-skia = "0.11"
ab_glyph = "0.2"
jpeg-encoder = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
